<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s10-title s10-desc" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s10-title">s10: System Prompt 运行时动态装配流水线</title>
  <desc id="s10-desc">展示分段定义、状态驱动判断、前缀缓存对齐以及最终组装生成 System Prompt 的完整架构</desc>

  <style>
    @keyframes crawlDashes {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -24; }
    }
    @keyframes pulseCache {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(22,163,74,0)); }
      50% { filter: drop-shadow(0 0 8px rgba(22,163,74,0.4)); }
    }
    .active-flow {
      stroke-dasharray: 6 4;
      animation: crawlDashes 1.2s linear infinite;
    }
    .cache-highlight {
      animation: pulseCache 2.5s ease-in-out infinite;
    }
  </style>

  <defs>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="rgba(45,49,66,0.12)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f5f5f5" rx="8"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.6"/>

  <!-- ==================== 1. 左侧：5 大 Section 模块库 ==================== -->
  <rect x="40" y="30" width="460" height="620" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <rect x="40" y="30" width="460" height="38" rx="8" fill="#ececec"/>
  <rect x="40" y="56" width="460" height="12" fill="#ececec"/>
  <text x="60" y="54" fill="#2d3142" font-size="12" font-weight="700">Section 模块库 (独立、高内聚、状态驱动)</text>

  <!-- Section 1: Identity (Cache Prefix) -->
  <g class="cache-highlight">
    <rect x="60" y="80" width="420" height="85" rx="6" fill="rgba(22,163,74,0.05)" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="72" y="72" width="165" height="16" rx="2" fill="#16a34a"/>
    <text x="154" y="83" fill="#ffffff" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SECTION 1 · 静态前缀 (Cache!)</text>
    <text x="80" y="105" fill="#166534" font-size="11" font-weight="700">Identity &amp; Base Persona (角色与行为准则)</text>
    <text x="80" y="125" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">"You are an AI coding agent. Act, don't explain."</text>
    <text x="80" y="145" fill="#16a34a" font-size="8" font-family="'Geist Mono', monospace">⚡ 始终前置且保持不变，最大化命中 Prompt Cache！</text>
  </g>

  <!-- Section 2: Environment -->
  <rect x="60" y="180" width="420" height="85" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
  <rect x="72" y="172" width="135" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="139" y="183" fill="#2d3142" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SECTION 2 · 环境感知</text>
  <text x="80" y="205" fill="#2d3142" font-size="11" font-weight="700">Workspace &amp; Git (工作区与分支状态)</text>
  <text x="80" y="225" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">动态注入：Path.cwd() + Git branch: main</text>
  <text x="80" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">根据当前所在项目和版本控制分支实时生成</text>

  <!-- Section 3: Enabled Tools -->
  <rect x="60" y="280" width="420" height="85" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
  <rect x="72" y="272" width="135" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="139" y="283" fill="#2d3142" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SECTION 3 · 状态过滤</text>
  <text x="80" y="305" fill="#2d3142" font-size="11" font-weight="700">Enabled Tools (工具清单与契约指导)</text>
  <text x="80" y="325" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">检查当前 TOOL_HANDLERS 激活列表</text>
  <text x="80" y="345" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">仅暴露当前可用的工具能力，杜绝幻觉</text>

  <!-- Section 4: Skills Manifest -->
  <rect x="60" y="380" width="420" height="85" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
  <rect x="72" y="372" width="135" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="139" y="383" fill="#2d3142" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SECTION 4 · 按需知识</text>
  <text x="80" y="405" fill="#2d3142" font-size="11" font-weight="700">Skills Manifest (领域技能目录)</text>
  <text x="80" y="425" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">扫描 skills/ 生成可用技能清单</text>
  <text x="80" y="445" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">存在 skills/ 目录时自动注入索引</text>

  <!-- Section 5: Memory Index -->
  <rect x="60" y="480" width="420" height="85" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.15)"/>
  <rect x="72" y="472" width="135" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="139" y="483" fill="#2d3142" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SECTION 5 · 长期记忆</text>
  <text x="80" y="505" fill="#2d3142" font-size="11" font-weight="700">Project Memory (长期记忆索引)</text>
  <text x="80" y="525" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">读取 .memory/MEMORY.md 索引内容</text>
  <text x="80" y="545" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">存在记忆文件时动态拼接进入 Prompt</text>

  <rect x="60" y="585" width="420" height="45" rx="4" fill="rgba(45,49,66,0.03)"/>
  <text x="270" y="612" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">⚙️ 触发原则：根据真实系统状态决定，绝非写死长字符串！</text>


  <!-- ==================== 2. 中间：装配中枢 Assemble Engine ==================== -->
  <path class="active-flow" d="M 480 340 L 550 340" fill="none" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
  <rect x="490" y="325" width="55" height="16" rx="2" fill="#ffffff" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="517" y="336" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">assemble()</text>


  <!-- ==================== 3. 右侧：最终生成的统一 System Prompt ==================== -->
  <rect x="560" y="30" width="400" height="620" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1.6"/>
  <rect x="560" y="30" width="400" height="38" rx="8" fill="rgba(235,108,54,0.12)"/>
  <rect x="560" y="56" width="400" height="12" fill="rgba(235,108,54,0.12)"/>
  <text x="580" y="54" fill="#eb6c36" font-size="12" font-weight="700">最终装配的 System Prompt (运行时生效)</text>

  <rect x="580" y="80" width="360" height="520" rx="6" fill="#f8f9fa" stroke="rgba(45,49,66,0.1)"/>
  
  <text x="595" y="105" fill="#166534" font-size="8.5" font-family="'Geist Mono', monospace" font-weight="600">[Cacheable Prefix: ~500 tokens]</text>
  <text x="595" y="125" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">You are a coding agent at /project.</text>
  <text x="595" y="142" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">Act, don't explain. Use tools.</text>
  
  <line x1="595" y1="160" x2="925" y2="160" stroke="rgba(45,49,66,0.15)"/>
  
  <text x="595" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Working directory: /Users/.../study</text>
  <text x="595" y="200" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Git branch: main (clean)</text>
  
  <line x1="595" y1="218" x2="925" y2="218" stroke="rgba(45,49,66,0.15)"/>
  
  <text x="595" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Available tools: [bash, read, write, edit]</text>
  <text x="595" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Always check permissions before edit.</text>
  
  <line x1="595" y1="276" x2="925" y2="276" stroke="rgba(45,49,66,0.15)"/>
  
  <text x="595" y="298" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">&lt;available_skills&gt;</text>
  <text x="605" y="316" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">- diagram-design: 28 visual types</text>
  <text x="605" y="334" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">- code-review: Standards &amp; Spec review</text>
  <text x="595" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">&lt;/available_skills&gt;</text>
  
  <line x1="595" y1="370" x2="925" y2="370" stroke="rgba(45,49,66,0.15)"/>
  
  <text x="595" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">&lt;project_memory&gt;</text>
  <text x="605" y="410" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">- user-tabs: 缩进必须用 Tab</text>
  <text x="605" y="428" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">- auth-jwt: 鉴权使用 JWT 网关</text>
  <text x="595" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">&lt;/project_memory&gt;</text>

  <text x="595" y="520" fill="#eb6c36" font-size="9" font-weight="600">🚀 结构清晰 · 缓存命中极高 · 多环境自适应！</text>

</svg>
