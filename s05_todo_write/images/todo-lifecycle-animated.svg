<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s05-title s05-desc" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s05-title">s05: TodoWrite 规划与状态机流转图</title>
  <desc id="s05-desc">展示复杂任务从初始拆解、状态机流转、Nag 催促到步骤完工的完整执行闭环</desc>

  <style>
    @keyframes crawlDashes {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -24; }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(235,108,54,0)); }
      50% { filter: drop-shadow(0 0 8px rgba(235,108,54,0.45)); }
    }
    .active-flow {
      stroke-dasharray: 6 4;
      animation: crawlDashes 1.2s linear infinite;
    }
    .focal-node {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
  </style>

  <defs>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="rgba(45,49,66,0.12)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f5f5f5" rx="8"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.6"/>

  <!-- ==================== 1. 动态流动连线 ==================== -->
  
  <!-- 用户任务 -> 初始规划 -->
  <line class="active-flow" x1="500" y1="74" x2="500" y2="105" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 初始规划 -> 认领任务 -->
  <line class="active-flow" x1="500" y1="165" x2="500" y2="205" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- 认领任务 -> 执行工具 -->
  <line class="active-flow" x1="500" y1="265" x2="500" y2="305" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- 执行工具 -> 标记完成 -->
  <line class="active-flow" x1="500" y1="365" x2="500" y2="405" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- 标记完成 -> 检查是否有剩余项 -->
  <line class="active-flow" x1="500" y1="465" x2="500" y2="505" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 判定：还有 pending? [YES] -> 循环回认领任务 -->
  <path class="active-flow" d="M 605 540 L 760 540 L 760 235 L 655 235" fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- 判定：还有 pending? [NO] -> 全部完成退出 -->
  <line x1="395" y1="540" x2="230" y2="540" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Nag 催促旁路 (连续 3 轮未更新 TODO) -->
  <path d="M 345 335 L 180 335 L 180 235 L 345 235" fill="none" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>


  <!-- ==================== 2. 标签与徽章 ==================== -->
  
  <rect x="620" y="531" width="110" height="18" rx="3" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
  <text x="675" y="543" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">有待办 · 下一步</text>

  <rect x="250" y="531" width="110" height="18" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="305" y="543" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">无待办 · 任务完工</text>

  <rect x="120" y="275" width="120" height="18" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="180" y="287" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Nag 催促 (&gt;=3轮未更新)</text>


  <!-- ==================== 3. 核心节点 ==================== -->

  <!-- ① 复杂任务输入 -->
  <g id="node-input">
    <rect x="375" y="32" width="250" height="42" rx="21" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="500" y="52" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">收到复杂长任务</text>
    <text x="500" y="65" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">"重构 10 个模块并跑通测试"</text>
  </g>

  <!-- ② 初始全量规划 -->
  <g id="node-plan" class="focal-node">
    <rect x="345" y="105" width="310" height="60" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.6"/>
    <rect x="357" y="97" width="120" height="16" rx="2" fill="#eb6c36" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="417" y="108" fill="#ffffff" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL: todo_write</text>
    <text x="500" y="131" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">初始化任务骨架清单</text>
    <text x="500" y="148" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">所有步骤设为 [pending]，建立上下文锚点</text>
  </g>

  <!-- ③ 状态转换 1: in_progress -->
  <g id="node-progress">
    <rect x="345" y="205" width="310" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="500" y="231" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">认领当前单一步骤</text>
    <text x="500" y="248" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">状态转为 [in_progress] (严格保持单任务专注)</text>
  </g>

  <!-- ④ 执行具体工具 -->
  <g id="node-exec">
    <rect x="345" y="305" width="310" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="500" y="331" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">执行原子工具操作</text>
    <text x="500" y="348" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">bash / read_file / write_file / edit_file</text>
  </g>

  <!-- ⑤ 状态转换 2: completed -->
  <g id="node-complete">
    <rect x="345" y="405" width="310" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="500" y="431" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">更新当前步骤为完成</text>
    <text x="500" y="448" fill="#16a34a" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">状态转为 [completed] · 打印实时彩色看板</text>
  </g>

  <!-- ⑥ 判定菱形 -->
  <g id="node-decision">
    <polygon points="500,505 605,540 500,575 395,540" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="500" y="538" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">还有未完成项?</text>
    <text x="500" y="551" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">check pending list</text>
  </g>

  <!-- ⑦ 任务完工出口 -->
  <g id="node-exit">
    <rect x="40" y="519" width="190" height="42" rx="21" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
    <text x="135" y="539" fill="#2d3142" font-size="11.5" font-weight="600" text-anchor="middle">全部完成 · 退出循环</text>
    <text x="135" y="552" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">All tasks completed</text>
  </g>

</svg>
