<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s03-title s03-desc" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="s03-title">s03: Permission 权限管线与三道安全闸门拓扑图</title>
  <desc id="s03-desc">展示静态黑名单拦截、动态规则识别与用户二次确认的三道安全防线架构</desc>

  <style>
    @keyframes crawlDashes {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -24; }
    }
    @keyframes pulseGate {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(235,108,54,0)); }
      50% { filter: drop-shadow(0 0 10px rgba(235,108,54,0.45)); }
    }
    .active-flow {
      stroke-dasharray: 6 4;
      animation: crawlDashes 1.2s linear infinite;
    }
    .gate-glow {
      animation: pulseGate 2.5s ease-in-out infinite;
    }
  </style>

  <defs>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="rgba(45,49,66,0.12)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f5f5f5" rx="8"/>
  <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.6"/>

  <!-- 1. 输入工具调用 -->
  <rect x="350" y="30" width="300" height="42" rx="21" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="500" y="51" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">捕获待执行工具块 (Tool Block)</text>
  <text x="500" y="64" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">check_permission(block)</text>

  <!-- 2. 三道闸门流水线 -->
  <!-- Gate 1: Hard Deny List -->
  <rect x="250" y="105" width="500" height="85" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="262" y="97" width="165" height="16" rx="2" fill="#dc2626"/>
  <text x="344" y="108" fill="#ffffff" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">GATE 1 · 硬性绝对黑名单</text>
  <text x="275" y="132" fill="#dc2626" font-size="11.5" font-weight="700">DENY_LIST 静态匹配 (绝对禁止)</text>
  <text x="275" y="150" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">命中 "rm -rf /", "sudo", "shutdown", "> /dev/sda" ...</text>
  <text x="275" y="168" fill="#7a8399" font-size="8">直接拦截熔断 · 绝不向用户询问，严防系统级破坏</text>

  <!-- Gate 2: Rule Matching -->
  <rect x="250" y="225" width="500" height="85" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <rect x="262" y="217" width="165" height="16" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="344" y="228" fill="#2d3142" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">GATE 2 · 动态敏感规则识别</text>
  <text x="275" y="252" fill="#2d3142" font-size="11.5" font-weight="700">PERMISSION_RULES 规则匹配</text>
  <text x="275" y="270" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">写工作区外文件？执行敏感删除 rm *.py？修改权限 chmod？</text>
  <text x="275" y="288" fill="#eb6c36" font-size="8" font-weight="600">命中规则 ──► 自动挂起并唤醒 Gate 3 用户交互审批</text>

  <!-- Gate 3: User Approval -->
  <g class="gate-glow">
    <rect x="250" y="345" width="500" height="85" rx="8" fill="#ffffff" stroke="#eb6c36" stroke-width="1.8"/>
    <rect x="262" y="337" width="165" height="16" rx="2" fill="#eb6c36"/>
    <text x="344" y="348" fill="#ffffff" font-size="7.5" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">GATE 3 · 人机交互确认</text>
    <text x="275" y="372" fill="#eb6c36" font-size="11.5" font-weight="700">ask_user() 用户二次审批</text>
    <text x="275" y="390" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">控制台高亮展示高危操作细节：Allow? [y/N]</text>
    <text x="275" y="408" fill="#16a34a" font-size="8" font-weight="600">人类用户享有最终裁决权：y 放行执行 / n 拒绝自愈</text>
  </g>

  <!-- 3. 最终流向结果 -->
  <!-- 左侧：拒绝分支 -->
  <rect x="40" y="480" width="380" height="75" rx="6" fill="rgba(220,38,38,0.04)" stroke="#dc2626" stroke-width="1.2"/>
  <text x="55" y="505" fill="#dc2626" font-size="11" font-weight="700">⛔ 拦截：返回 Permission Denied</text>
  <text x="55" y="525" fill="#4f5d75" font-size="8.5">不执行真实工具，把拒绝原因包装为 tool_result 喂回</text>
  <text x="55" y="542" fill="#eb6c36" font-size="8" font-weight="600">模型收到拒绝信息后，会自动换一种无害方式重试！</text>

  <!-- 右侧：放行分支 -->
  <rect x="580" y="480" width="380" height="75" rx="6" fill="rgba(22,163,74,0.04)" stroke="#16a34a" stroke-width="1.2"/>
  <text x="595" y="505" fill="#166534" font-size="11" font-weight="700">✓ 放行：调用 TOOL_HANDLERS</text>
  <text x="595" y="525" fill="#4f5d75" font-size="8.5">安全通过所有闸门，正式执行文件写入或 Shell 命令</text>
  <text x="595" y="542" fill="#166534" font-size="8" font-weight="600">将真实执行结果输出回传模型</text>

  <!-- 连线体系 -->
  <line class="active-flow" x1="500" y1="72" x2="500" y2="105" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line class="active-flow" x1="500" y1="190" x2="500" y2="225" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line class="active-flow" x1="500" y1="310" x2="500" y2="345" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

  <!-- Gate 1 拦截线 -->
  <path class="active-flow" d="M 250 145 L 140 145 L 140 480" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <!-- Gate 3 拒绝线 -->
  <path class="active-flow" d="M 250 385 L 230 385 L 230 480" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <!-- Gate 3 放行线 -->
  <path class="active-flow" d="M 750 385 L 770 385 L 770 480" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

</svg>
